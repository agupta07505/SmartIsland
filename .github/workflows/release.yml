name: Release

on:
  push:
    branches: [main]
    paths:
      - "app/build.gradle.kts"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ── 1. Detect version bump ──────────────────────────────────────────
  check-version:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and existing tags
        id: check
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "Error: app/build.gradle.kts does not exist"
            exit 1
          fi

          NEW_VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$NEW_VERSION" ]; then
            echo "Error: Could not find versionName in app/build.gradle.kts"
            exit 1
          fi

          echo "Detected version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists. Skipping release."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$NEW_VERSION does not exist. Proceeding with release."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build signed release APK ────────────────────────────────────
  build-release:
    name: Build signed release
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_name: ${{ steps.version.outputs.apk_name }}
      version_tag: ${{ steps.version.outputs.version_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Resolve version info
        id: version
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          echo "version_tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=SmartIsland-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "APK_NAME=SmartIsland-v$VERSION.apk" >> "$GITHUB_ENV"

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is not configured}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not configured}"

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/smartIsland.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n[:space:]' | base64 --decode > "$KEYSTORE_PATH"

          KEY_ALIAS=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | sed -n 's/^Alias name: //p' | head -n 1)
          test -n "$KEY_ALIAS" || { echo "Unable to detect a key alias" >&2; exit 1; }

          echo "SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify and stage APK
        run: |
          SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          OUTPUT_APK="app/build/outputs/apk/release/$APK_NAME"
          APKSIGNER="$ANDROID_HOME/build-tools/$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort -V | tail -n 1)/apksigner"

          test -f "$SOURCE_APK" || { echo "Release APK was not produced" >&2; exit 1; }
          cp "$SOURCE_APK" "$OUTPUT_APK"
          "$APKSIGNER" verify --verbose --print-certs "$OUTPUT_APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartIsland-release
          path: app/build/outputs/apk/release/SmartIsland-v*.apk
          if-no-files-found: error
          retention-days: 30

  # ── 3. GitHub Release + Telegram ────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [check-version, build-release]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: SmartIsland-release

      - name: Resolve changelog range
        id: changelog_range
        run: |
          LAST_TAG="$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)"
          if [ -n "$LAST_TAG" ]; then
            FROM_REF="$LAST_TAG"
          else
            FROM_REF="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          echo "from_ref=$FROM_REF" >> "$GITHUB_OUTPUT"
          echo "to_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: "COMMIT"
          fromTag: ${{ steps.changelog_range.outputs.from_ref }}
          toTag: ${{ steps.changelog_range.outputs.to_ref }}
          configurationJson: |
            {
              "template": "# Changelog\n\n#{{CHANGELOG}}\n\n<details>\n<summary>Other changes</summary>\n\n#{{UNCATEGORIZED}}\n</details>\n",
              "pr_template": "- #{{TITLE}} — by @#{{AUTHOR}}",
              "categories": [
                { "title": "## Features", "labels": ["feat", "feature"] },
                { "title": "## Fixes", "labels": ["fix", "bug"] },
                { "title": "## Performance", "labels": ["perf"] },
                { "title": "## Refactors", "labels": ["refactor"] },
                { "title": "## Documentation", "labels": ["docs"] },
                { "title": "## Build / CI", "labels": ["build", "ci"] }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: .*$",
                  "on_property": "title",
                  "target": "$1"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK_NAME: ${{ needs.build-release.outputs.apk_name }}
          VERSION_TAG: ${{ needs.build-release.outputs.version_tag }}
        run: |
          ASSET="$APK_NAME"

          cat > release_notes.md <<EOF
          > **Smart Island $VERSION_TAG** brings a lightweight, privacy-conscious Dynamic Island experience to Android with glanceable notifications, calls, media controls, battery status, and quick app shortcuts.

          ${{ steps.build_changelog.outputs.changelog }}

          ## Download and install

          Download the signed Android APK: **[$APK_NAME](https://github.com/$GH_REPO/releases/download/$VERSION_TAG/$APK_NAME)**

          Smart Island supports **Android 8.0 and newer**.

          > Android may ask you to allow installation from your browser or file manager. After installation, Smart Island guides you through the overlay and notification permissions it needs.

          ## Project links

          [Full changelog](https://github.com/$GH_REPO/blob/main/CHANGELOG.md) · [Features and setup](https://github.com/$GH_REPO#readme) · [Privacy](https://github.com/$GH_REPO/blob/main/PRIVACY.md) · [Report a bug](https://github.com/$GH_REPO/issues/new?template=bug_report.md) · [Request a feature](https://github.com/$GH_REPO/issues/new?template=feature_request.md)

          ---
          EOF

          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" "$ASSET" --clobber
          else
            gh release create "$VERSION_TAG" "$ASSET" \
              --title "Smart Island $VERSION_TAG - Android Dynamic Island" \
              --notes-file release_notes.md \
              --target "${{ github.sha }}"
          fi

      - name: Forward release APK to Telegram
        if: ${{ !cancelled() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          TELEGRAM_RELEASE_TOPIC_ID: ${{ secrets.TELEGRAM_RELEASE_TOPIC_ID }}
          VERSION_TAG: ${{ needs.build-release.outputs.version_tag }}
        run: |
          chmod +x ./scripts/send-telegram.sh
          ./scripts/send-telegram.sh "${{ needs.build-release.outputs.apk_name }}" "Release"

  # ── 4. Auto-close referenced issues ─────────────────────────────────
  notify-issues:
    name: Notify referenced issues
    needs: [check-version, publish]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Auto-close referenced issues
        uses: actions/github-script@v7
        env:
          VERSION_TAG: v${{ needs.check-version.outputs.new_version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const versionTag = process.env.VERSION_TAG;
            const commentMarker = "<!-- smart-island-release-reference -->";
            const referencedIssuePattern = /#([1-9]\d*)\b/g;
            const headCommit = context.payload.head_commit;
            const commitMessages = headCommit?.message ? [headCommit.message] : [];

            const issueNumbers = [
              ...new Set(
                commitMessages.flatMap((message) =>
                  [...message.matchAll(referencedIssuePattern)].map((m) => Number(m[1]))
                )
              )
            ];

            if (issueNumbers.length === 0) {
              core.info("No referenced issues found in the commit message.");
              return;
            }

            for (const issueNumber of issueNumbers) {
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });

                if (issue.data.pull_request) {
                  core.info(`Skipped #${issueNumber} — it is a pull request.`);
                  continue;
                }

                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  per_page: 100
                });

                if (comments.some((c) => (c.body ?? "").includes(commentMarker))) {
                  core.info(`Issue #${issueNumber} already has a release notification.`);
                  continue;
                }

                const author = issue.data.user.login;
                const commitUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;
                const commitSha = context.sha.substring(0, 7);
                const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${versionTag}`;

                const body = [
                  commentMarker,
                  `Hey @${author}, this issue was referenced in commit [\`${commitSha}\`](${commitUrl}) and has been included in [**Smart Island ${versionTag}**](${releaseUrl}).`,
                  "",
                  "This issue is being closed automatically after the referenced fix."
                ].join("\n");

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body
                });

                if (issue.data.state !== "closed") {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    state: "closed",
                    state_reason: "completed"
                  });
                  core.info(`Closed issue #${issueNumber}.`);
                }
              } catch (error) {
                core.warning(`Failed to notify issue #${issueNumber}: ${error.message}`);
              }
            }
