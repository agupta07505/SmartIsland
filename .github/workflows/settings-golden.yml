name: Settings golden files

# Generates app/src/test/resources/settings_defaults.golden from the current code, then runs
# PersistedKeysTest and SettingsBackupCompatTest against it. The generated file is uploaded as an
# artifact for review. With commit_to_branch it is also pushed to a new branch (never to main or
# dev) so it can be reviewed in a pull request.

on:
  workflow_dispatch:
    inputs:
      commit_to_branch:
        description: "Also push the golden file to a review branch"
        type: boolean
        default: false

concurrency:
  group: settings-golden-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  golden:
    name: Generate golden file and run compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Generate settings_defaults.golden
        env:
          UPDATE_GOLDEN: "1"
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest --rerun --tests "*SettingsBackupCompatTest*"

      - name: Show the generated file
        run: |
          test -s app/src/test/resources/settings_defaults.golden
          wc -l app/src/test/resources/settings_defaults.golden
          git diff --stat -- app/src/test/resources || true

      - name: Upload golden file
        uses: actions/upload-artifact@v4
        with:
          name: settings-defaults-golden
          path: app/src/test/resources/settings_defaults.golden
          if-no-files-found: error
          retention-days: 14

      - name: Run both compatibility test classes without UPDATE_GOLDEN
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest --rerun-tasks --tests "*PersistedKeysTest*" --tests "*SettingsBackupCompatTest*"

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: settings-golden-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Push golden file to a review branch
        if: ${{ inputs.commit_to_branch }}
        run: |
          branch="chore/settings-defaults-golden-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add app/src/test/resources/settings_defaults.golden
          git commit -m "Add settings defaults golden file (generated by workflow run ${GITHUB_RUN_ID})"
          git push origin "$branch"
          echo "Pushed $branch; open a pull request and review the file before merging." >> "$GITHUB_STEP_SUMMARY"
