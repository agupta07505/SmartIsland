name: Telegram Community Notifications

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened, closed]
  watch:
    types: [started]

permissions:
  contents: read

jobs:
  notify:
    name: Forward event to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send Telegram notification
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ secrets.TELEGRAM_TOPIC_ID }}
          TELEGRAM_EVENTS_TOPIC_ID: ${{ secrets.TELEGRAM_EVENTS_TOPIC_ID }}
        with:
          script: |
            const token = process.env.TELEGRAM_BOT_TOKEN;
            let chatId = process.env.TELEGRAM_CHAT_ID;
            const topicId = process.env.TELEGRAM_EVENTS_TOPIC_ID || process.env.TELEGRAM_TOPIC_ID;

            if (!token || !chatId) {
              core.notice('Telegram secrets not configured. Skipping notification.');
              return;
            }

            chatId = chatId.trim();
            if (/^\d{9,}$/.test(chatId)) chatId = '-100' + chatId;

            const repo = context.repo.owner + '/' + context.repo.repo;
            const repoUrl = 'https://github.com/' + repo;
            const event = context.eventName;
            const action = context.payload.action;

            const SEP = '\n━━━━━━━━━━━━━━━━━━━━━━\n';
            const FOOTER = SEP + '🏝️ <i>Smart Island — ' + repo + '</i>';

            function esc(s) {
              return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }
            function trunc(s, n) {
              s = s || '';
              return s.length > n ? s.slice(0, n - 3) + '...' : s;
            }

            let message = '';

            // ── New Issue ────────────────────────────────
            if (event === 'issues' && action === 'opened') {
              const issue = context.payload.issue;
              const title = esc(issue.title);
              const user = esc(issue.user.login);
              const url = issue.html_url;
              const num = issue.number;
              const body = esc(trunc(issue.body, 300));
              const rawTitle = (issue.title || '').toLowerCase();
              const rawBody = (issue.body || '').toLowerCase();

              let typeIcon = '📋', typeLabel = 'Issue';
              if (rawTitle.startsWith('[bug]') || rawBody.includes('steps to reproduce'))
                { typeIcon = '🐛'; typeLabel = 'Bug Report'; }
              else if (rawTitle.startsWith('[feat') || rawBody.includes('feature request'))
                { typeIcon = '💡'; typeLabel = 'Feature Request'; }
              else if (rawTitle.startsWith('[question') || rawBody.includes('how do i'))
                { typeIcon = '❓'; typeLabel = 'Question'; }

              const labels = (issue.labels || []).map(l => '<code>' + esc(l.name) + '</code>').join('  ');
              const labelLine = labels ? '\n🏷 <b>Labels:</b>  ' + labels : '';

              message = typeIcon + ' <b>New ' + typeLabel + ' #' + num + '</b>'
                + SEP
                + '📌 <b>' + title + '</b>\n'
                + '\n👤 <b>Author:</b>  <a href="https://github.com/' + issue.user.login + '">' + user + '</a>'
                + labelLine
                + SEP
                + '📝 <b>Description</b>\n'
                + '<blockquote>' + (body || '<i>No description provided</i>') + '</blockquote>'
                + SEP
                + '🔗 <a href="' + url + '">View Issue #' + num + ' on GitHub</a>'
                + FOOTER;
            }

            // ── Pull Request Opened ──────────────────────
            else if (event === 'pull_request_target' && action === 'opened') {
              const pr = context.payload.pull_request;
              const title = esc(pr.title);
              const user = esc(pr.user.login);
              const url = pr.html_url;
              const num = pr.number;
              const body = esc(trunc(pr.body, 300));
              const base = esc(pr.base.ref);
              const head = esc(pr.head.ref);
              const adds = pr.additions || 0;
              const dels = pr.deletions || 0;
              const files = pr.changed_files || 0;
              const isDraft = pr.draft === true;
              const labels = (pr.labels || []).map(l => '<code>' + esc(l.name) + '</code>').join('  ');
              const labelLine = labels ? '\n🏷 <b>Labels:</b>  ' + labels : '';

              message = '🔀 <b>New Pull Request #' + num + '</b>' + (isDraft ? '  <i>(Draft)</i>' : '')
                + SEP
                + '📌 <b>' + title + '</b>\n'
                + '\n👤 <b>Author:</b>  <a href="https://github.com/' + pr.user.login + '">' + user + '</a>'
                + '\n🎯 <b>Target:</b>  <code>' + head + '</code> → <code>' + base + '</code>'
                + '\n📊 <b>Changes:</b>  <code>+' + adds + '</code> / <code>-' + dels + '</code>  across <code>' + files + '</code> file' + (files !== 1 ? 's' : '')
                + labelLine
                + SEP
                + '📝 <b>Description</b>\n'
                + '<blockquote>' + (body || '<i>No description provided</i>') + '</blockquote>'
                + SEP
                + '🔗 <a href="' + url + '">View PR #' + num + '</a>  •  <a href="' + url + '/files">Changed Files</a>'
                + FOOTER;
            }

            // ── Pull Request Merged ──────────────────────
            else if (event === 'pull_request_target' && action === 'closed' && context.payload.pull_request.merged) {
              const pr = context.payload.pull_request;
              const title = esc(pr.title);
              const user = esc(pr.user.login);
              const mergedBy = (pr.merged_by || pr.user);
              const merger = esc(mergedBy.login);
              const url = pr.html_url;
              const num = pr.number;
              const base = esc(pr.base.ref);
              const adds = pr.additions || 0;
              const dels = pr.deletions || 0;
              const files = pr.changed_files || 0;
              const commits = pr.commits || 0;

              message = '✅ <b>PR #' + num + ' Merged</b>'
                + SEP
                + '📌 <b>' + title + '</b>\n'
                + '\n👤 <b>Author:</b>  <a href="https://github.com/' + pr.user.login + '">' + user + '</a>'
                + '\n🔀 <b>Merged by:</b>  <a href="https://github.com/' + mergedBy.login + '">' + merger + '</a>'
                + '\n🎯 <b>Into:</b>  <code>' + base + '</code>'
                + '\n📊 <b>Stats:</b>  <code>' + commits + '</code> commit' + (commits !== 1 ? 's' : '')
                + '  ·  <code>+' + adds + '</code> / <code>-' + dels + '</code>'
                + '  ·  <code>' + files + '</code> file' + (files !== 1 ? 's' : '')
                + SEP
                + '🔗 <a href="' + url + '">View PR #' + num + '</a>  •  <a href="' + url + '/files">Diff</a>'
                + FOOTER;
            }

            // ── New Star ─────────────────────────────────
            else if (event === 'watch' && action === 'started') {
              const sender = context.payload.sender;
              const user = esc(sender.login);

              let starCount = '?';
              try {
                const { data: rd } = await github.rest.repos.get({
                  owner: context.repo.owner, repo: context.repo.repo
                });
                starCount = rd.stargazers_count;
              } catch (e) { core.warning('Star count fetch failed: ' + e.message); }

              let bio = '', location = '', followers = 0, publicRepos = 0;
              try {
                const { data: ud } = await github.rest.users.getByUsername({ username: sender.login });
                bio = ud.bio ? esc(trunc(ud.bio, 100)) : '';
                location = ud.location ? esc(ud.location) : '';
                followers = ud.followers || 0;
                publicRepos = ud.public_repos || 0;
              } catch (e) { /* ignore */ }

              const milestones = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000];
              let milestone = '';
              for (const m of milestones) {
                if (starCount === m) { milestone = '\n\n🎉 <b>Milestone reached: ' + m + ' ⭐ stars!</b>'; break; }
              }

              const bioLine = bio ? '\n  <i>' + bio + '</i>' : '';
              const locLine = location ? '\n  📍 ' + location : '';

              message = '⭐ <b>New Star!</b>  (Total: <b>' + starCount + '</b> ⭐)' + milestone
                + SEP
                + '👤 <a href="https://github.com/' + sender.login + '">' + user + '</a>'
                + bioLine + locLine
                + '\n  👥 <code>' + followers + '</code> followers  ·  📦 <code>' + publicRepos + '</code> repos'
                + SEP
                + '🔗 <a href="' + repoUrl + '">Smart Island on GitHub</a>  •  <a href="' + repoUrl + '/stargazers">All Stargazers</a>'
                + FOOTER;
            }

            // ── PR closed without merge — skip ───────────
            else if (event === 'pull_request_target' && action === 'closed' && !context.payload.pull_request.merged) {
              core.notice('PR closed without merge. Skipping notification.');
              return;
            }

            else {
              core.notice('Unhandled event: ' + event + '/' + action + '. Skipping.');
              return;
            }

            // ── Send to Telegram ─────────────────────────
            const params = new URLSearchParams();
            params.append('chat_id', chatId);
            params.append('text', message);
            params.append('parse_mode', 'HTML');
            params.append('disable_web_page_preview', 'true');
            if (topicId) params.append('message_thread_id', topicId.trim());

            const url = 'https://api.telegram.org/bot' + token.trim() + '/sendMessage';
            const resp = await fetch(url, { method: 'POST', body: params });
            const json = await resp.json();

            if (json.ok) {
              core.notice('Telegram notification sent successfully!');
            } else {
              core.setFailed('Telegram API error: ' + JSON.stringify(json));
            }
