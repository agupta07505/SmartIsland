name: Automated PR & Issue Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issues:
    types: [opened, edited]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  review_pr:
    name: Automated PR Review
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Review PR Content & Guidelines
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const title = pr.title || '';
            
            const comments = [];
            const labelsToAdd = [];

            // Check PR title conventions
            const conventionalCommitRegex = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+/;
            if (!conventionalCommitRegex.test(title)) {
              comments.push('⚠️ **PR Title Format**: Consider using conventional commits (e.g., `feat(ui): ...`, `fix(overlay): ...`, `docs: ...`) for clear changelog generation.');
            }

            // Check PR Checklist completeness
            const hasChecklist = body.includes('- [x]') || body.includes('- [X]');
            const hasUnchecked = body.includes('- [ ]');
            if (!hasChecklist && hasUnchecked) {
              comments.push('📋 **Checklist Incomplete**: Please review and check the relevant items in the PR checklist.');
            }

            // Detect modified areas by files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            let touchesOverlay = false;
            let touchesListener = false;
            let touchesManifest = false;
            let touchesDocs = false;
            let touchesTests = false;

            for (const file of files) {
              if (file.filename.includes('Overlay')) touchesOverlay = true;
              if (file.filename.includes('Listener') || file.filename.includes('Notification')) touchesListener = true;
              if (file.filename.includes('AndroidManifest.xml')) touchesManifest = true;
              if (file.filename.endsWith('.md') || file.filename.startsWith('docs/')) touchesDocs = true;
              if (file.filename.includes('src/test/')) touchesTests = true;
            }

            if (touchesOverlay) labelsToAdd.push('overlay');
            if (touchesListener) labelsToAdd.push('notifications');
            if (touchesDocs) labelsToAdd.push('documentation');
            if (touchesManifest) {
              comments.push('🔒 **Manifest Change**: `AndroidManifest.xml` was modified. Please ensure zero unauthorized permissions or exposed services are added without documentation.');
            }

            // Add labels if any
            if (labelsToAdd.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  labels: labelsToAdd
                });
              } catch (e) {
                console.log('Error adding labels: ' + e.message);
              }
            }

  triage_issue:
    name: Automated Issue Triage & Review
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Review & Triage Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const title = issue.title || '';
            const labelsToAdd = [];

            // Detect category
            if (title.toLowerCase().startsWith('[bug]') || body.toLowerCase().includes('steps to reproduce')) {
              labelsToAdd.push('bug');
            } else if (title.toLowerCase().startsWith('[feat]') || title.toLowerCase().startsWith('[feature]') || body.toLowerCase().includes('expected behavior')) {
              labelsToAdd.push('enhancement');
            }

            // Check for OEM mentions
            const oemKeywords = ['samsung', 'oneui', 'xiaomi', 'miui', 'hyperos', 'oneplus', 'oxygenos', 'oppo', 'coloros', 'realme', 'vivo', 'iqoo', 'funtouch', 'huawei', 'honor'];
            const mentionsOem = oemKeywords.some(kw => body.toLowerCase().includes(kw) || title.toLowerCase().includes(kw));
            if (mentionsOem) {
              labelsToAdd.push('oem-specific');
            }

            // Add labels
            if (labelsToAdd.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: labelsToAdd
                });
              } catch (e) {
                console.log('Error adding labels: ' + e.message);
              }
            }
